<title>Chain of Earths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* War-room campaign table: full-bleed hex map, brass-on-slate controls docked bottom (phone) or right (desktop) */
:root{
  --ink:#0b1418;--panel:#121c21;--panel2:#18252b;--line:#273840;--fg:#e7e1d1;--mute:#93a19f;
  --brass:#d9ae55;--crimson:#cf5a4e;--aether:#8fdcff;--good:#8fc37a;--warn:#e0a548;--bad:#e06a5e;
  --f-display:"IM Fell English SC",Georgia,serif;--f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to bottom,rgba(11,20,24,.96) 55%,rgba(11,20,24,0));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#h-realm{font-family:var(--f-display);font-size:21px;line-height:1;color:var(--brass);letter-spacing:.01em;text-wrap:balance}
#h-date{font-family:var(--f-mono);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#h-local{font-size:12px;color:var(--aether);margin-top:2px}#h-local:empty{display:none}
.grow{flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:1px;padding:4px 10px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.stat b,.stat div{font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.stat small{font-size:11px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}.str{color:var(--aether)}.tech{color:#c9b6ff}.org{color:#e3c88f}.wld{color:#9fd0c8}
#h-world{font:600 14px var(--f-ui);color:var(--aether);background:rgba(143,220,255,.08);border:1px solid rgba(143,220,255,.35);border-radius:999px;padding:5px 12px 5px 12px;cursor:pointer;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#h-world::after{content:" ▾";opacity:.7}
#endturn{font:700 14px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#1b1406;background:var(--brass);border:0;border-radius:6px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 0 #8a6a25}
#endturn:disabled{opacity:.5}
#endturn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--aether);outline-offset:2px}
#mode{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--panel2);border:1px solid var(--brass);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);font-size:14px}
#mode button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 10px;font:600 13px var(--f-ui);cursor:pointer}
#toast{position:absolute;z-index:7;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);width:min(440px,calc(100% - 32px));background:rgba(18,28,33,.97);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#toast b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--brass)}
#sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;max-height:56%;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.4)}
#grip{height:18px;display:flex;justify-content:center;align-items:center;cursor:pointer;background:none;border:0;width:100%}
#grip::before{content:"";width:42px;height:4px;border-radius:2px;background:var(--line)}
#tabs{display:flex;gap:2px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
#tabs button{flex:1 0 auto;min-width:0;font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.04em;padding-left:6px!important;padding-right:6px!important;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;cursor:pointer}
#tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
#body{overflow-y:auto;padding-top:10px;padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:none;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#sheet.open #body{display:flex}
@media (min-width:900px){
  #sheet{top:0;left:auto;width:390px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-right:0}
  #sheet #body{display:flex}#grip{display:none}
  #hud{right:390px}#mode,#toast{left:calc((100% - 390px)/2)}
}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:rgba(217,174,85,.55)}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;text-wrap:balance}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;color:var(--brass)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.sm,.sm{font-size:13px}
.num{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--brass)}
.num.sm{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.note{margin:0;font-size:14px;line-height:1.45;color:#c9c4b6}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts.col{flex-direction:column;align-items:stretch}
.inline{display:flex;gap:8px}.inline select{flex:1;min-width:0}
button{font:600 14px var(--f-ui);color:var(--fg);background:#22323a;border:1px solid #33474f;border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{background:#2a3d46}
button.pri{background:var(--brass);color:#1b1406;border-color:#b68b33}
button.pri:hover{background:#e6bd63}
button.ghost{background:transparent}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input:not([type]){font:500 15px var(--f-ui);color:var(--fg);background:#0f181c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin-top:4px}
.bar{display:block;height:6px;border-radius:3px;background:#0d1519;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.g i{background:var(--good)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.meter{display:flex;justify-content:space-between;align-items:baseline}.meter b{font-family:var(--f-mono);font-size:22px}
.track{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}.track:first-of-type{border-top:0}
.slider{display:grid;grid-template-columns:1fr 44px;gap:2px 10px;align-items:center}
.slider label{grid-column:1/-1;font-size:13px;color:var(--mute)}
.slider input{width:100%;accent-color:var(--brass)}
.slider output{text-align:right}
.urow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(39,56,64,.6);font-size:14px}
.urow:first-of-type{border-top:0}
.urow .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:700 11px var(--f-mono);padding:2px 5px;border-radius:3px;color:#0b1418;background:var(--brass);min-width:22px;text-align:center}
.chip.a{background:var(--crimson)}.chip.m{background:#b7a27a}.chip.g{background:#c3a0d8}.chip.c{background:#9fc0d6}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.traits{display:flex;flex-direction:column;gap:4px}
.tr{font-size:14px;display:flex;gap:6px;align-items:baseline}.tr input{accent-color:var(--brass)}
.empty h3{margin:0}.empty p{color:var(--mute);margin:6px 0 0;line-height:1.45}
.empty{padding:6px 2px}
.log p{margin:0 0 6px;font-size:14px;line-height:1.45}.log .eyebrow{margin-top:8px;color:var(--brass)}
.chain{overflow-x:auto;margin:0 -6px}
.chain svg{display:block}
.chain .ln{stroke:#3b5059;stroke-width:1.5}.chain .ln.st{stroke-dasharray:3 4}
.chain .nd{fill:#0f181c;stroke:#557079;stroke-width:1.5}.chain .nd.mine{stroke:var(--brass);fill:#2a2412}.chain .nd.enemy{stroke:var(--crimson)}.chain .nd.cur{stroke:#fff;stroke-width:2.5}.chain .nd.stub{stroke-dasharray:2 3;fill:none}
.chain .ab{font:700 11px var(--f-mono);fill:var(--fg);text-anchor:middle;pointer-events:none}
.chain .q{font:600 11px var(--f-mono);fill:var(--mute);text-anchor:middle}
.chain .nm{font:500 11px var(--f-ui);fill:var(--mute);text-anchor:middle;pointer-events:none}
.chain .wn{cursor:pointer}
#over{position:absolute;inset:0;z-index:20;background:rgba(5,9,11,.78);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#over .card{max-width:420px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.chain .nd.odd{stroke-dasharray:3 2;fill:#1d1328}
#h-todo:empty{display:none}
.chipbtn{font:600 12px var(--f-ui);padding:3px 10px;border-radius:999px;background:rgba(217,174,85,.12);border:1px solid rgba(217,174,85,.45);color:var(--brass)}
#ctx{position:absolute;z-index:12;min-width:220px;max-width:280px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column}
#ctx[hidden]{display:none}
#ctx button{text-align:left;background:none;border:0;border-radius:5px;padding:7px 10px;font:500 14px var(--f-ui)}
#ctx button:hover,#ctx button:focus-visible{background:#22323a}
.ctx-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:6px 10px 4px}
.ctx-n{font-size:13px;color:var(--mute);padding:6px 10px}
#tip{position:absolute;z-index:9;pointer-events:none;background:rgba(11,20,24,.94);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;line-height:1.35;max-width:230px}
#tip b{font-weight:600;color:var(--brass)}
kbd{font:500 10px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--mute);margin-left:4px}
.tag{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--brass);border:1px solid rgba(217,174,85,.45);border-radius:4px;padding:1px 5px;vertical-align:middle}
.tag.odd{color:#c9a4ff;border-color:rgba(167,123,232,.5)}
.tbl{overflow-x:auto}.tbl table{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px 4px 0}.tbl td{padding:4px 6px 4px 0;border-top:1px solid rgba(39,56,64,.6);font-variant-numeric:tabular-nums}
button.link{background:none;border:0;padding:0;color:var(--aether);font:inherit;text-align:left;cursor:pointer}
.seg{display:flex;gap:2px}.seg button.on{background:var(--brass);color:#1b1406;border-color:#b68b33}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}.split i{display:block;min-width:2px}.f-arms{background:#d9ae55}.f-logi{background:#8fdcff}.f-agri{background:#8fc37a}.f-arc{background:#b6a4ff}
.chip.x{background:#a77be8}
@media (max-width:520px){#h-realm{font-size:18px}.stat{padding:3px 8px}.stat b,.stat div{font-size:13px}}
</style>
<div id="app">
  <canvas id="map" aria-label="Campaign map"></canvas>
  <header id="hud">
    <div class="hrow"><div class="grow"><div id="h-realm"></div><div id="h-date"></div><div id="h-local"></div></div><button id="endturn">End quarter</button></div>
    <div class="hrow">
      <div class="stat"><span>Treasury</span><div id="h-gold"></div></div>
      <div class="stat"><span>Supply</span><div id="h-sup"></div></div>
      <div class="stat"><span>Load / cap</span><b id="h-load"></b></div>
      <button id="h-world" aria-label="Choose Earth"></button>
    </div>
    <div class="hrow" id="h-todo"></div>
  </header>
  <div id="mode" hidden><span id="mode-t"></span><button id="mode-x">Cancel</button></div>
  <div id="toast" hidden role="status"></div>
  <div id="ctx" hidden role="menu"></div>
  <div id="tip" hidden></div>
  <section id="sheet">
    <button id="grip" aria-label="Show or hide panel"></button>
    <nav id="tabs" aria-label="Panels"><button data-tab="hex" title="1">Hex</button><button data-tab="realm" title="2">Realm</button><button data-tab="court" title="3">Court</button><button data-tab="research" title="4">Science</button><button data-tab="orgs" title="5">Firms</button><button data-tab="worlds" title="6">Earths</button><button data-tab="log" title="7">Log</button></nav>
    <div id="body"></div>
  </section>
  <div id="over" hidden></div>
</div>
<script>
__LOGIC__
</script>
<script>
__UI__
</script>
