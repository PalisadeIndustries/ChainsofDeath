<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chain of Earths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* War-room campaign table: full-bleed hex map, brass-on-slate controls docked bottom (phone) or right (desktop) */
:root{
  --ink:#0b1418;--panel:#121c21;--panel2:#18252b;--line:#273840;--fg:#e7e1d1;--mute:#93a19f;
  --brass:#d9ae55;--crimson:#cf5a4e;--aether:#8fdcff;--good:#8fc37a;--warn:#e0a548;--bad:#e06a5e;
  --f-display:"IM Fell English SC",Georgia,serif;--f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to bottom,rgba(11,20,24,.96) 55%,rgba(11,20,24,0));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#h-realm{font-family:var(--f-display);font-size:21px;line-height:1;color:var(--brass);letter-spacing:.01em;text-wrap:balance}
#h-date{font-family:var(--f-mono);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#h-local{font-size:12px;color:var(--aether);margin-top:2px}#h-local:empty{display:none}
.grow{flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:1px;padding:4px 10px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.stat b,.stat div{font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.stat small{font-size:11px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}.str{color:var(--aether)}.tech{color:#c9b6ff}.org{color:#e3c88f}.wld{color:#9fd0c8}
#h-world{font:600 14px var(--f-ui);color:var(--aether);background:rgba(143,220,255,.08);border:1px solid rgba(143,220,255,.35);border-radius:999px;padding:5px 12px 5px 12px;cursor:pointer;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#h-world::after{content:" ▾";opacity:.7}
#endturn{font:700 14px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#1b1406;background:var(--brass);border:0;border-radius:6px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 0 #8a6a25}
#endturn:disabled{opacity:.5}
#endturn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--aether);outline-offset:2px}
#mode{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--panel2);border:1px solid var(--brass);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);font-size:14px}
#mode button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 10px;font:600 13px var(--f-ui);cursor:pointer}
#toast{position:absolute;z-index:7;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);width:min(440px,calc(100% - 32px));background:rgba(18,28,33,.97);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#toast b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--brass)}
#sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;max-height:56%;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.4)}
#grip{height:18px;display:flex;justify-content:center;align-items:center;cursor:pointer;background:none;border:0;width:100%}
#grip::before{content:"";width:42px;height:4px;border-radius:2px;background:var(--line)}
#tabs{display:flex;gap:2px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
#tabs button{flex:1 0 auto;min-width:0;font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.04em;padding-left:6px!important;padding-right:6px!important;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;cursor:pointer}
#tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
#body{overflow-y:auto;padding-top:10px;padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:none;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#sheet.open #body{display:flex}
@media (min-width:900px){
  #sheet{top:0;left:auto;width:390px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-right:0}
  #sheet #body{display:flex}#grip{display:none}
  #hud{right:390px}#mode,#toast{left:calc((100% - 390px)/2)}
}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:rgba(217,174,85,.55)}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;text-wrap:balance}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;color:var(--brass)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.sm,.sm{font-size:13px}
.num{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--brass)}
.num.sm{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.note{margin:0;font-size:14px;line-height:1.45;color:#c9c4b6}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts.col{flex-direction:column;align-items:stretch}
.inline{display:flex;gap:8px}.inline select{flex:1;min-width:0}
button{font:600 14px var(--f-ui);color:var(--fg);background:#22323a;border:1px solid #33474f;border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{background:#2a3d46}
button.pri{background:var(--brass);color:#1b1406;border-color:#b68b33}
button.pri:hover{background:#e6bd63}
button.ghost{background:transparent}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input:not([type]){font:500 15px var(--f-ui);color:var(--fg);background:#0f181c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin-top:4px}
.bar{display:block;height:6px;border-radius:3px;background:#0d1519;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.g i{background:var(--good)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.meter{display:flex;justify-content:space-between;align-items:baseline}.meter b{font-family:var(--f-mono);font-size:22px}
.track{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}.track:first-of-type{border-top:0}
.slider{display:grid;grid-template-columns:1fr 44px;gap:2px 10px;align-items:center}
.slider label{grid-column:1/-1;font-size:13px;color:var(--mute)}
.slider input{width:100%;accent-color:var(--brass)}
.slider output{text-align:right}
.urow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(39,56,64,.6);font-size:14px}
.urow:first-of-type{border-top:0}
.urow .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:700 11px var(--f-mono);padding:2px 5px;border-radius:3px;color:#0b1418;background:var(--brass);min-width:22px;text-align:center}
.chip.a{background:var(--crimson)}.chip.m{background:#b7a27a}.chip.g{background:#c3a0d8}.chip.c{background:#9fc0d6}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.traits{display:flex;flex-direction:column;gap:4px}
.tr{font-size:14px;display:flex;gap:6px;align-items:baseline}.tr input{accent-color:var(--brass)}
.empty h3{margin:0}.empty p{color:var(--mute);margin:6px 0 0;line-height:1.45}
.empty{padding:6px 2px}
.log p{margin:0 0 6px;font-size:14px;line-height:1.45}.log .eyebrow{margin-top:8px;color:var(--brass)}
.chain{overflow-x:auto;margin:0 -6px}
.chain svg{display:block}
.chain .ln{stroke:#3b5059;stroke-width:1.5}.chain .ln.st{stroke-dasharray:3 4}
.chain .nd{fill:#0f181c;stroke:#557079;stroke-width:1.5}.chain .nd.mine{stroke:var(--brass);fill:#2a2412}.chain .nd.enemy{stroke:var(--crimson)}.chain .nd.cur{stroke:#fff;stroke-width:2.5}.chain .nd.stub{stroke-dasharray:2 3;fill:none}
.chain .ab{font:700 11px var(--f-mono);fill:var(--fg);text-anchor:middle;pointer-events:none}
.chain .q{font:600 11px var(--f-mono);fill:var(--mute);text-anchor:middle}
.chain .nm{font:500 11px var(--f-ui);fill:var(--mute);text-anchor:middle;pointer-events:none}
.chain .wn{cursor:pointer}
#over{position:absolute;inset:0;z-index:20;background:rgba(5,9,11,.78);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#over .card{max-width:420px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.chain .nd.odd{stroke-dasharray:3 2;fill:#1d1328}
#h-todo:empty{display:none}
.chipbtn{font:600 12px var(--f-ui);padding:3px 10px;border-radius:999px;background:rgba(217,174,85,.12);border:1px solid rgba(217,174,85,.45);color:var(--brass)}
#ctx{position:absolute;z-index:12;min-width:220px;max-width:280px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column}
#ctx[hidden]{display:none}
#ctx button{text-align:left;background:none;border:0;border-radius:5px;padding:7px 10px;font:500 14px var(--f-ui)}
#ctx button:hover,#ctx button:focus-visible{background:#22323a}
.ctx-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:6px 10px 4px}
.ctx-n{font-size:13px;color:var(--mute);padding:6px 10px}
#tip{position:absolute;z-index:9;pointer-events:none;background:rgba(11,20,24,.94);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;line-height:1.35;max-width:230px}
#tip b{font-weight:600;color:var(--brass)}
kbd{font:500 10px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--mute);margin-left:4px}
.tag{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--brass);border:1px solid rgba(217,174,85,.45);border-radius:4px;padding:1px 5px;vertical-align:middle}
.tag.odd{color:#c9a4ff;border-color:rgba(167,123,232,.5)}
.tbl{overflow-x:auto}.tbl table{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px 4px 0}.tbl td{padding:4px 6px 4px 0;border-top:1px solid rgba(39,56,64,.6);font-variant-numeric:tabular-nums}
button.link{background:none;border:0;padding:0;color:var(--aether);font:inherit;text-align:left;cursor:pointer}
.seg{display:flex;gap:2px}.seg button.on{background:var(--brass);color:#1b1406;border-color:#b68b33}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}.split i{display:block;min-width:2px}.f-arms{background:#d9ae55}.f-logi{background:#8fdcff}.f-agri{background:#8fc37a}.f-arc{background:#b6a4ff}
.chip.x{background:#a77be8}
@media (max-width:520px){#h-realm{font-size:18px}.stat{padding:3px 8px}.stat b,.stat div{font-size:13px}}

[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#070c0f}
#h-net{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#h-net:empty{display:none}
#h-net .pl{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-ui);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:rgba(11,20,24,.6)}
#h-net .pl i{width:8px;height:8px;border-radius:50%;display:inline-block}
#h-net .pl.rd{border-color:rgba(143,195,122,.7)}
#h-net .pl.off{opacity:.55}
#h-net .pl.dead{text-decoration:line-through;opacity:.45}
#h-net .dl{font-size:12px;color:var(--mute)}
#endturn.on{background:#3a4a52;color:var(--fg)}
#lobby{position:absolute;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 30%,#16262d,#070c0f 75%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#lobby[hidden]{display:none}
#lobby .card{width:100%;max-width:440px}
#lobby input,#lobby select{width:100%}
#lobby .row input{flex:1}
#lobby .chk{display:flex;gap:8px;align-items:center;font-size:14px}
#lobby .chk input{width:auto}
#lobby .dot{width:9px;height:9px;border-radius:50%;background:#45545a;flex:none}
#lobby .dot.on{background:#8fc37a}
#lobby .urow{display:flex;gap:8px;align-items:center}
#chat{position:absolute;z-index:15;right:12px;top:150px;width:min(340px,calc(100vw - 32px));max-height:min(420px,60vh);background:var(--panel2);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
#chat[hidden]{display:none}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
#chat-log{overflow-y:auto;padding:8px 10px;flex:1;font-size:14px;line-height:1.4}
#chat-log p{margin:0 0 6px}
#chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#chat-in{flex:1;min-width:0}
#net-down{position:absolute;z-index:40;top:8px;left:50%;transform:translateX(-50%);background:#5a2a24;color:#fff;font:600 13px var(--f-ui);padding:6px 12px;border-radius:6px}
#net-down[hidden]{display:none}
</style>
<div id="app">
  <canvas id="map" aria-label="Campaign map"></canvas>
  <header id="hud">
    <div class="hrow"><div class="grow"><div id="h-realm"></div><div id="h-date"></div><div id="h-local"></div></div><button id="endturn" title="Enter">Ready</button></div>
    <div class="hrow">
      <div class="stat"><span>Treasury</span><div id="h-gold"></div></div>
      <div class="stat"><span>Supply</span><div id="h-sup"></div></div>
      <div class="stat"><span>Load / cap</span><b id="h-load"></b></div>
      <button id="h-world" aria-label="Choose Earth"></button>
    </div>
    <div class="hrow" id="h-todo"></div>
    <div class="hrow" id="h-net"></div>
  </header>
  <div id="mode" hidden><span id="mode-t"></span><button id="mode-x">Cancel</button></div>
  <div id="toast" hidden role="status"></div>
  <div id="ctx" hidden role="menu"></div>
  <div id="tip" hidden></div>
  <section id="sheet">
    <button id="grip" aria-label="Show or hide panel"></button>
    <nav id="tabs" aria-label="Panels"><button data-tab="hex" title="1">Hex</button><button data-tab="realm" title="2">Realm</button><button data-tab="court" title="3">Court</button><button data-tab="research" title="4">Science</button><button data-tab="orgs" title="5">Firms</button><button data-tab="worlds" title="6">Earths</button><button data-tab="log" title="7">Log</button></nav>
    <div id="body"></div>
  </section>
  <div id="over" hidden></div>
  <section id="chat" hidden aria-label="Dispatches"><header><b>Dispatches</b><button class="ghost sm" id="chat-x">Close</button></header><div id="chat-log"></div><form id="chat-f"><input id="chat-in" maxlength="300" placeholder="Message every player" autocomplete="off"><button class="pri sm">Send</button></form></section>
  <div id="lobby"><div class="card"><p class="note">Connecting to the server…</p></div></div>
  <div id="net-down" hidden>Connection lost. Reconnecting…</div>
</div>
<script src="/game.js"></script>
<script>
'use strict';
/* ================= UI STATE ================= */
const $=s=>document.querySelector(s);
const cv=$('#map'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1;
const cam={x:0,y:0,z:1.4};
let planCrews=1,tmoveHub=null,curW=0,selHex=null,selUnit=null,mode=null,plan=null,tab='hex',sheetOpen=true,R=null,dirty=true,confirmNew=false;
let ctxPrev=null;const selUnits=new Set();let pathCache={};let terrV=0,TERR=null,FOGC=null,lastTap=null,lastEvents=[];
const COL={P:'#d9ae55',A:'#cf5a4e',M:'#a77be8',ocean:'#0f1d24',civ:'#8fc9b8',company:'#b7a27a',estate:'#c3a0d8',org:'#9fc0d6'};
const hubCol=h=>h.o!==ME?oc(h.o):h.kind==='civ'?COL.civ:h.kind==='company'?COL.company:h.kind==='estate'?COL.estate:h.org?COL.org:COL.P;
const TERC=['#12232b','#5f6d3f','#3b5432','#6e6145','#837d72','#a58f5e','#6f786b','#c6cfd1','#14091c','#8aa0a8','#5d3f6e','#b9ae90'];
const movable=u=>u&&u.o===ME&&!u.merc&&!u.guard&&!u.co&&!u.party&&!u.corps;
const idleUnits=()=>G.units.filter(u=>movable(u)&&!u.dest&&!u.hold&&!u.auto&&!u.air);

/* ================= TERRAIN RASTER ================= */
const base=document.createElement('canvas');base.width=Math.ceil(MAPW+HW);base.height=Math.ceil(MAPH);
(function(){const b=base.getContext('2d');b.fillStyle=TERC[0];b.fillRect(0,0,base.width,base.height);
  const hexP=(c,x,y,s)=>{c.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);c.lineTo(x+s*Math.cos(a),y+s*Math.sin(a))}c.closePath()};
  for(let i=0;i<NT;i++){const t=T[i];const x=cxOf(i),y=cyOf(i);let col=TERC[t];
    if(!t){let coast=false;for(let q=0;q<6;q++){const nb=NB[i*6+q];if(nb>=0&&T[nb])coast=true}if(coast)col='#16303a'}
    const v=(h2(i,7,1)-0.5)*0.12;
    for(const dx of [0,MAPW]){if(dx&&x>HW*1.2)continue;hexP(b,x+dx,y,S+0.6);b.fillStyle=col;b.fill();if(v){b.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;b.fill()}
      if(t){b.strokeStyle='rgba(0,0,0,0.18)';b.lineWidth=0.8;b.stroke()}}}
  b.lineCap='round';
  for(let i=0;i<NT;i++){const t=T[i];if(t!==4&&t!==3&&t!==2)continue;const x=cxOf(i),y=cyOf(i);b.strokeStyle='rgba(20,18,14,0.35)';b.lineWidth=1.1;

function bootView(){if(!booted){booted=true;resize();cam.z=window.innerWidth<600?1.25:1.6;curW=RM.home;centerOn(capOf(ME).i);tab='hex';openSheet(window.innerWidth>=900);requestAnimationFrame(loop)}
  if(!G.disc[curW]||G.worlds[curW].hidden)curW=RM.home;
  for(const id of [...selUnits])if(!G.units.some(u=>u.id===id))selUnits.delete(id);if(selUnit!=null&&!G.units.some(u=>u.id===selUnit))selUnit=[...selUnits][0]??null;
  for(const k in pathCache)delete pathCache[k];for(const k in foreignCache)delete foreignCache[k];FOGC=null;TERR=null;refresh()}
window.addEventListener('resize',()=>{resize();clampCam()});

/* ================= NETWORK, LOBBY AND DISPATCHES ================= */
const NET={ws:null,code:null,token:null,seat:null,started:false,ready:false,q:0,cbs:{},status:null,lobby:null,chat:[],unread:0,tries:0,overShown:false,
  send(m){if(this.ws&&this.ws.readyState===1){this.ws.send(JSON.stringify(m));return true}toast('Not connected. Retrying…');return false},
  leave(){try{localStorage.removeItem('coe-seat')}catch(e){}location.href='/'}};
function cmd(name,args,cb){const q=++NET.q;if(cb)NET.cbs[q]=cb;NET.send({t:'cmd',name,args:args||{},q})}
const LATER={};function later(k,f){clearTimeout(LATER[k]);LATER[k]=setTimeout(f,400)}
function oc(o){return o===ME?COL.P:o==='M'?COL.M:(G&&G.realms[o]&&G.realms[o].color)||COL.A}
const seatColor=k=>(G&&G.realms['r'+k]&&G.realms['r'+k].color)||'#8a9499';
function savedSeat(){try{return JSON.parse(localStorage.getItem('coe-seat')||'null')}catch(e){return null}}
function storeSeat(code,token){try{localStorage.setItem('coe-seat',JSON.stringify({code,token}))}catch(e){}}

function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');NET.ws=ws;
  ws.onopen=()=>{NET.tries=0;$('#net-down').hidden=true;const sv=savedSeat();const urlCode=(location.pathname.match(/^\/g\/([A-Za-z0-9]{4,8})/)||[])[1];
    if(sv&&(!urlCode||urlCode.toUpperCase()===sv.code))ws.send(JSON.stringify({t:'resume',code:sv.code,token:sv.token}));else showLobby(urlCode)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onNet(m)};
  ws.onclose=()=>{NET.ws=null;if(NET.code)$('#net-down').hidden=false;const d=Math.min(15000,800*Math.pow(1.6,NET.tries++));setTimeout(connect,d)}}

function onNet(m){
  if(m.t==='joined'){NET.code=m.code;NET.token=m.token;NET.seat=m.seat;storeSeat(m.code,m.token);if(!location.pathname.startsWith('/g/'))history.replaceState(null,'','/g/'+m.code);return}
  if(m.t==='err'){if(m.gone){try{localStorage.removeItem('coe-seat')}catch(e){}NET.code=null;showLobby()}lobbyErr(m.msg);if(NET.started)toast(esc(m.msg));return}
  if(m.t==='lobby'){NET.lobby=m;if(m.started){NET.started=true;$('#lobby').hidden=true}else renderLobby();return}
  if(m.t==='status'){NET.status=m;const me=m.players.find(p=>p.k===NET.seat);NET.ready=!!(me&&me.ready);renderNet();return}
  if(m.t==='chat'){if(m.all)NET.chat=m.msgs;else{NET.chat.push(...m.msgs);if(NET.chat.length>200)NET.chat.shift();if($('#chat').hidden&&m.msgs.some(x=>x.k!==NET.seat))NET.unread+=m.msgs.length}renderChat();renderNet();return}
  if(m.t==='view'){NET.started=true;$('#lobby').hidden=true;loadView(m.view);bootView();
    if(m.err)toast(esc(m.err));
    if(m.q&&NET.cbs[m.q]){const f=NET.cbs[m.q];delete NET.cbs[m.q];if(!m.err)f(m.res)}
    if(m.resolved){plan=null;NET.ready=false;const ev=m.events||[];lastEvents=ev;
      const key2=ev.filter(l=>['win','loss','strange','tech','world','org'].includes(l.kind)&&!/ crossed from /.test(l.txt)).slice(0,3);const more=ev.length-key2.length;
      toast(`<b>${dateStr()}</b>${key2.length?key2.map(l=>`<span>${esc(l.txt)}</span>`).join(''):'<span>A quiet quarter.</span>'}${more>0?`<span class="mute">${more} more in the log. Tap to open.</span>`:''}`,key2.length?6500:2200)}
    if(G.over&&!NET.overShown){NET.overShown=true;showOver()}
    return}}

/* ---------- HUD: who is ready, and the deadline ---------- */
function fmtLeft(ms){if(ms<=0)return 'any moment';const h=Math.floor(ms/3600e3),mi=Math.floor(ms%3600e3/60e3);return h?`${h}h ${mi}m`:mi?`${mi}m`:'under a minute'}
function renderNet(){const st=NET.status;const b=$('#endturn');if(!b)return;
  if(!st||!G){b.textContent='Ready';return}
  const live=st.players.filter(p=>p.alive);const nr=live.filter(p=>p.ready).length;
  b.textContent=G.over?'War over':NET.ready?`Waiting · ${nr}/${live.length}`:'Ready';b.classList.toggle('on',NET.ready);b.disabled=!!G.over||!RM.alive;
  $('#h-net').innerHTML=st.players.map(p=>`<span class="pl${p.ready?' rd':''}${p.online?'':' off'}${p.alive?'':' dead'}" title="${esc(p.name)}${p.realm?' · '+esc(p.realm):''}${p.online?'':' (offline)'}${p.ready?' · ready':''}"><i style="background:${seatColor(p.k)}"></i>${esc(p.name)}${p.ready?' ✓':''}</span>`).join('')
    +(st.deadline?`<span class="dl mono">${fmtLeft(st.deadline-Date.now())} left</span>`:'')
    +`<button class="chipbtn" id="chat-open">Dispatches${NET.unread?` · ${NET.unread}`:''}</button>`;
  $('#chat-open').onclick=()=>{const c=$('#chat');c.hidden=!c.hidden;if(!c.hidden){NET.unread=0;renderChat();renderNet();$('#chat-in').focus()}}}
setInterval(()=>{if(NET.status&&NET.status.deadline)renderNet()},30e3);

/* ---------- dispatches (chat) ---------- */
function renderChat(){const l=$('#chat-log');if(!l)return;const at=l.scrollTop+l.clientHeight>=l.scrollHeight-8;
  l.innerHTML=NET.chat.length?NET.chat.map(c=>`<p><b style="color:${seatColor(c.k)}">${esc(c.name)}</b> ${esc(c.text)}</p>`).join(''):'<p class="mute">No dispatches yet. Messages here go to every player in this game.</p>';
  if(at)l.scrollTop=l.scrollHeight}
$('#chat-f').addEventListener('submit',e=>{e.preventDefault();const i=$('#chat-in');const v=i.value.trim();if(!v)return;if(NET.send({t:'chat',text:v}))i.value=''});
$('#chat-x').addEventListener('click',()=>{$('#chat').hidden=true});

/* ---------- lobby ---------- */
function lobbyErr(msg){const e=$('#lb-err');if(e){e.textContent=msg||'';e.hidden=!msg}}
let lobbyMode='new';
function showLobby(code){$('#lobby').hidden=false;if(code){lobbyMode='join';NET.prefill=code.toUpperCase()}NET.lobby=null;renderLobby()}
function renderLobby(){const L=$('#lobby');L.hidden=false;const lb=NET.lobby;
  if(lb&&NET.code){const host=NET.seat===lb.host;const link=location.origin+'/g/'+lb.code;
    L.innerHTML=`<div class="card"><div class="eyebrow">Waiting room</div><h2>Game ${esc(lb.code)}</h2>
      <p class="note">Send friends this link, or the code. They join with a name and a PIN they choose; the same name and PIN gets them back in later.</p>
      <div class="row"><input id="lb-link" readonly value="${esc(link)}"><button class="ghost sm" id="lb-copy">Copy</button></div>
      <div class="eyebrow">Seats · ${lb.seats.length} of ${lb.maxSeats}</div>
      ${lb.seats.map(s=>`<div class="urow"><span class="dot${s.online?' on':''}"></span><span class="grow">${esc(s.name)}${s.k===lb.host?' <span class="tag">host</span>':''}</span><span class="mute">${esc(s.realm||'realm name chosen at start')}</span></div>`).join('')}
      ${host?`<label class="lab" for="lb-hours">Time limit per quarter</label><select id="lb-hours">${[[0,'None · resolve when everyone is ready'],[1,'1 hour'],[4,'4 hours'],[12,'12 hours'],[24,'1 day'],[48,'2 days']].map(([v,n])=>`<option value="${v}"${+lb.hours===v?' selected':''}>${n}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="lb-ai"${lb.fillAI?' checked':''}> Fill empty seats with computer realms</label>
      <div class="acts"><button class="pri" id="lb-start"${lb.seats.length<2&&!lb.fillAI?' disabled':''}>Start the war</button><button class="ghost" id="lb-leave">Leave</button></div>
      ${lb.seats.length<2&&!lb.fillAI?'<p class="note">Wait for at least one more player, or fill empty seats with computer realms.</p>':''}`
      :`<p class="note">Waiting for the host to start. Time limit: ${+lb.hours?lb.hours+' h per quarter':'none'}${lb.fillAI?' · empty seats go to computer realms':''}.</p><div class="acts"><button class="ghost" id="lb-leave">Leave</button></div>`}
      <p class="neg" id="lb-err" hidden></p></div>`;
    $('#lb-copy').onclick=()=>{const i=$('#lb-link');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}$('#lb-copy').textContent='Copied'};
    $('#lb-leave').onclick=()=>NET.leave();
    if(host){const upd=()=>NET.send({t:'settings',hours:+$('#lb-hours').value,fillAI:$('#lb-ai').checked});$('#lb-hours').onchange=upd;$('#lb-ai').onchange=upd;
      $('#lb-start').onclick=()=>{$('#lb-start').disabled=true;$('#lb-start').textContent='Building the worlds…';NET.send({t:'start'})}}
    return}
  const nm=(()=>{try{return localStorage.getItem('coe-name')||''}catch(e){return ''}})();
  L.innerHTML=`<div class="card"><div class="eyebrow">Chain of Earths · multiplayer</div><h2>${lobbyMode==='new'?'Start a game':'Join a game'}</h2>
    <div class="seg"><button class="${lobbyMode==='new'?'on':''}" data-lm="new">New game</button><button class="${lobbyMode==='join'?'on':''}" data-lm="join">Join with a code</button></div>
    ${lobbyMode==='join'?`<label class="lab" for="lb-code">Game code</label><input id="lb-code" maxlength="8" autocomplete="off" value="${esc(NET.prefill||'')}" style="text-transform:uppercase">`:''}
    <label class="lab" for="lb-name">Your name</label><input id="lb-name" maxlength="24" value="${esc(nm)}">
    <label class="lab" for="lb-realm">Realm name <span class="mute">(optional)</span></label><input id="lb-realm" maxlength="40" placeholder="A name is chosen for you if blank">
    <label class="lab" for="lb-pin">PIN <span class="mute">(lets you rejoin from another device)</span></label><input id="lb-pin" maxlength="12" inputmode="numeric" autocomplete="off">
    ${lobbyMode==='new'?`<label class="lab" for="lb-seats">Seats</label><select id="lb-seats">${[2,3,4,5].map(n=>`<option value="${n}"${n===5?' selected':''}>${n} realms</option>`).join('')}</select>
    <label class="lab" for="lb-hours">Time limit per quarter</label><select id="lb-hours"><option value="0">None · resolve when everyone is ready</option><option value="1">1 hour</option><option value="4">4 hours</option><option value="12">12 hours</option><option value="24" >1 day</option><option value="48">2 days</option></select>
    <label class="chk"><input type="checkbox" id="lb-ai"> Fill empty seats with computer realms</label>`:''}
    <div class="acts"><button class="pri" id="lb-go">${lobbyMode==='new'?'Create game':'Join game'}</button></div><p class="neg" id="lb-err" hidden></p></div>`;
  L.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{lobbyMode=b.dataset.lm;renderLobby()});
  $('#lb-go').onclick=()=>{const name=$('#lb-name').value.trim();if(!name)return lobbyErr('Enter your name.');try{localStorage.setItem('coe-name',name)}catch(e){}
    const base={name,realm:$('#lb-realm').value.trim(),pin:$('#lb-pin').value};
    if(lobbyMode==='new')NET.send(Object.assign(base,{t:'create',seats:+$('#lb-seats').value,hours:+$('#lb-hours').value,fillAI:$('#lb-ai').checked}));
    else{const code=$('#lb-code').value.trim().toUpperCase();if(!code)return lobbyErr('Enter the game code.');NET.send(Object.assign(base,{t:'join',code}))}}}
connect();

</script>

</html>
